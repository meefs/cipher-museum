name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The corpus replay in test:engines reads public/corpus/all.jsonl,
          # which is stored in Git LFS.
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run validate:release

      - name: Verify cipher engines
        run: npm run test:engines

      - name: Run test suites
        run: npm test

      - name: Lint HTML
        run: npm run lint:html

  validate-corpus:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate corpus schema
        run: npm run validate:corpus

  deploy-pages:
    needs: [test, validate-corpus]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Verify corpus download bytes
        working-directory: public/corpus
        run: sha256sum -c SHA256SUMS.txt

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
